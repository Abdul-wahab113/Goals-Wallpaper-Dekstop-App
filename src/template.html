<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Outfit:wght@300;400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: #070e1a;
            color: #e2e8f0;
            font-family: 'Outfit', sans-serif;
            display: flex;
            flex-direction: column;
            padding: 60px 80px;
            gap: 44px;
            position: relative;
        }

        /* scanlines */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(0deg,
                    transparent, transparent 3px,
                    rgba(56, 189, 248, 0.012) 3px, rgba(56, 189, 248, 0.012) 4px);
            pointer-events: none;
            z-index: 0;
        }

        /* grid */
        body::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(56, 189, 248, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        .glow-tl {
            position: absolute;
            top: -120px;
            left: -80px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.07) 0%, transparent 65%);
            pointer-events: none;
            z-index: 0;
        }

        .glow-br {
            position: absolute;
            bottom: -100px;
            right: -60px;
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.055) 0%, transparent 65%);
            pointer-events: none;
            z-index: 0;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 1;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.8);
        }

        .header-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 400;
            color: #38bdf8;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .header-sep {
            width: 1px;
            height: 18px;
            background: rgba(255, 255, 255, 0.08);
        }

        .header-sub {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: #112233;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #34d399;
            box-shadow: 0 0 8px rgba(52, 211, 153, 0.7);
        }

        .live-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: #34d399;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .header-date {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: #112233;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1.15fr;
            gap: 32px;
            flex: 1;
            position: relative;
            z-index: 1;
        }

        .card {
            background: rgba(255, 255, 255, 0.022);
            border: 0.5px solid rgba(255, 255, 255, 0.07);
            border-radius: 12px;
            padding: 32px 36px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 36px;
            right: 36px;
            height: 1px;
        }

        .card-weekly::before {
            background: linear-gradient(90deg, transparent, #a78bfa, transparent);
        }

        .card-daily::before {
            background: linear-gradient(90deg, transparent, #34d399, transparent);
        }

        .card-notes::before {
            background: linear-gradient(90deg, transparent, #fb923c, transparent);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 18px;
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.055);
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .dot-weekly {
            background: #a78bfa;
            box-shadow: 0 0 10px rgba(167, 139, 250, 0.6);
        }

        .dot-daily {
            background: #34d399;
            box-shadow: 0 0 10px rgba(52, 211, 153, 0.6);
        }

        .dot-notes {
            background: #fb923c;
            box-shadow: 0 0 10px rgba(251, 146, 60, 0.6);
        }

        .card-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .label-weekly {
            color: #a78bfa;
        }

        .label-daily {
            color: #34d399;
        }

        .label-notes {
            color: #fb923c;
        }

        .card-count {
            margin-left: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.12);
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            flex: 1;
        }

        .task-item {
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }

        .task-arrow {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            flex-shrink: 0;
            margin-top: 2px;
            opacity: 0.4;
        }

        .arrow-weekly {
            color: #a78bfa;
        }

        .arrow-daily {
            color: #34d399;
        }

        .task-text {
            font-size: 19px;
            font-weight: 300;
            color: #7a8fa6;
            line-height: 1.5;
            letter-spacing: 0.01em;
        }

        /* Notes style */
        .note-item {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 12px 16px;
            background: rgba(251, 146, 60, 0.04);
            border: 0.5px solid rgba(251, 146, 60, 0.14);
            border-radius: 8px;
        }

        .note-prefix {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: rgba(251, 146, 60, 0.35);
            flex-shrink: 0;
            margin-top: 2px;
        }

        .note-text {
            font-size: 17px;
            font-weight: 300;
            color: #7a8fa6;
            line-height: 1.5;
        }

        /* Progress bar */
        .progress-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: auto;
        }

        .pbar-track {
            flex: 1;
            height: 2px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 1px;
        }

        .pbar-fill {
            height: 2px;
            border-radius: 1px;
        }

        .pbar-weekly {
            background: #a78bfa;
        }

        .pbar-daily {
            background: #34d399;
        }

        .pbar-pct {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            min-width: 32px;
            text-align: right;
        }

        .pct-weekly {
            color: rgba(167, 139, 250, 0.4);
        }

        .pct-daily {
            color: rgba(52, 211, 153, 0.4);
        }

        /* Footer */
        .footer {
            display: flex;
            align-items: center;
            gap: 20px;
            position: relative;
            z-index: 1;
        }

        .footer-line {
            flex: 1;
            height: 0.5px;
            background: rgba(255, 255, 255, 0.04);
        }

        .footer-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: #0d1f2d;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }
    </style>
</head>

<body>
    <div class="glow-tl"></div>
    <div class="glow-br"></div>

    <div class="header">
        <div class="header-left">
            <div class="pulse-dot"></div>
            <div class="header-title">goal.wallpaper</div>
            <div class="header-sep"></div>
            <div class="header-sub">focus system v2</div>
        </div>
        <div class="header-right">
            <div class="live-badge">
                <div class="live-dot"></div>
                <div class="live-text">live</div>
            </div>
            <div class="header-date">{{DATE}}</div>
        </div>
    </div>

    <div class="grid">

        <div class="card card-weekly">
            <div class="card-header">
                <div class="dot dot-weekly"></div>
                <div class="card-label label-weekly">weekly</div>
                <div class="card-count">{{WEEKLY_COUNT}} tasks</div>
            </div>
            <div class="task-list">{{WEEKLY_ITEMS}}</div>
            <div class="progress-row">
                <div class="pbar-track">
                    <div class="pbar-fill pbar-weekly" style="width:{{WEEKLY_PROGRESS}}%"></div>
                </div>
                <div class="pbar-pct pct-weekly">{{WEEKLY_PROGRESS}}%</div>
            </div>
        </div>

        <div class="card card-daily">
            <div class="card-header">
                <div class="dot dot-daily"></div>
                <div class="card-label label-daily">daily</div>
                <div class="card-count">{{DAILY_COUNT}} tasks</div>
            </div>
            <div class="task-list">{{DAILY_ITEMS}}</div>
            <div class="progress-row">
                <div class="pbar-track">
                    <div class="pbar-fill pbar-daily" style="width:{{DAILY_PROGRESS}}%"></div>
                </div>
                <div class="pbar-pct pct-daily">{{DAILY_PROGRESS}}%</div>
            </div>
        </div>

        <div class="card card-notes">
            <div class="card-header">
                <div class="dot dot-notes"></div>
                <div class="card-label label-notes">notes</div>
                <div class="card-count">{{NOTES_COUNT}} notes</div>
            </div>
            <div class="task-list">{{NOTES_ITEMS}}</div>
        </div>

    </div>

    <div class="footer">
        <div class="footer-line"></div>
        <div class="footer-text">stay focused. ship it.</div>
        <div class="footer-line"></div>
    </div>
</body>

</html>
