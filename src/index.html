<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Goal Wallpaper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Syne:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
  <style>
    /* KEEP ALL YOUR EXACT EXISTING CSS HERE (I am truncating to save space, but paste your original <style> block here) */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #06090f;
      --bg2: #0c1220;
      --bg3: #111927;
      --border: rgba(255, 255, 255, 0.07);
      --border2: rgba(255, 255, 255, 0.13);
      --text: #c8d6e5;
      --muted: #3d5166;
      --accent-b: #38bdf8;
      --accent-v: #a78bfa;
      --accent-g: #34d399;
      --accent-o: #fb923c;
      --accent-r: #f87171;
      --accent-y: #fbbf24;
      --mono: 'JetBrains Mono', monospace;
      --display: 'Syne', sans-serif;
      --radius: 10px;
      --sidebar: 256px;
    }

    html,
    body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--display);
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: var(--sidebar);
      background: var(--bg2);
      border-right: 0.5px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 0;
      flex-shrink: 0;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .brand {
      padding: 20px 20px 18px;
      border-bottom: 0.5px solid var(--border);
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 3px;
    }

    .brand-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-b);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.7);
      flex-shrink: 0;
    }

    .brand-name {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      color: var(--accent-b);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .brand-sub {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding-left: 15px;
    }

    .nav {
      padding: 10px 0;
      flex: 1;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      transition: all 0.15s;
      border-left: 2px solid transparent;
      user-select: none;
    }

    .nav-item:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.025);
    }

    .nav-item.active {
      color: var(--text);
      border-left-color: var(--nc);
      background: rgba(255, 255, 255, 0.03);
    }

    .nav-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--nc);
      flex-shrink: 0;
    }

    .nav-count {
      margin-left: auto;
      font-size: 9px;
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 7px;
      border-radius: 20px;
      color: var(--muted);
    }

    .sidebar-footer {
      padding: 14px 16px 18px;
      border-top: 0.5px solid var(--border);
    }

    .unsaved-badge {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      margin-bottom: 10px;
      background: rgba(251, 191, 36, 0.07);
      border: 0.5px solid rgba(251, 191, 36, 0.25);
      border-radius: 7px;
      font-family: var(--mono);
      font-size: 9px;
      color: var(--accent-y);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .unsaved-badge.show {
      display: flex;
    }

    .unsaved-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent-y);
      animation: blink 1s infinite;
    }

    .apply-btn {
      width: 100%;
      padding: 11px;
      background: rgba(56, 189, 248, 0.08);
      border: 0.5px solid rgba(56, 189, 248, 0.25);
      border-radius: var(--radius);
      color: var(--accent-b);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.15s;
    }

    .apply-btn:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.45);
    }

    .apply-btn:active {
      transform: scale(0.98);
    }

    .apply-btn.saving {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .shortcut-hint {
      text-align: center;
      margin-top: 7px;
      font-family: var(--mono);
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    .kbd {
      display: inline-block;
      padding: 1px 5px;
      background: var(--bg3);
      border: 0.5px solid var(--border2);
      border-radius: 3px;
      font-size: 9px;
      color: var(--muted);
    }

    .status-line {
      margin-top: 10px;
      text-align: center;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.09em;
      height: 14px;
      transition: color 0.3s;
      color: var(--muted);
    }

    .status-line.loading {
      color: var(--muted);
    }

    .status-line.success {
      color: var(--accent-g);
    }

    .status-line.error {
      color: var(--accent-r);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      border-bottom: 0.5px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
    }

    .topbar-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .live-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      background: rgba(52, 211, 153, 0.06);
      border: 0.5px solid rgba(52, 211, 153, 0.18);
      border-radius: 20px;
      font-family: var(--mono);
      font-size: 9px;
      color: var(--accent-g);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .live-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent-g);
      animation: blink 1.5s infinite;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: 0.3
      }
    }

    .icon-btn {
      width: 30px;
      height: 30px;
      background: var(--bg2);
      border: 0.5px solid var(--border);
      border-radius: 7px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 13px;
      transition: all 0.15s;
    }

    .icon-btn:hover {
      color: var(--text);
      border-color: var(--border2);
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
    }

    .content::-webkit-scrollbar {
      width: 4px;
    }

    .content::-webkit-scrollbar-thumb {
      background: var(--bg3);
      border-radius: 2px;
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    .sec-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .sec-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .sec-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .add-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      background: transparent;
      border: 0.5px solid var(--border2);
      border-radius: 6px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.15s;
    }

    .add-btn:hover {
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.03);
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 28px;
    }

    .task-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: var(--bg2);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      transition: border-color 0.15s, background 0.15s;
    }

    .task-card:hover {
      border-color: var(--border2);
      background: var(--bg3);
    }

    .task-card:focus-within {
      border-color: rgba(56, 189, 248, 0.25);
    }

    .drag-handle {
      color: var(--muted);
      font-size: 11px;
      cursor: grab;
      opacity: 0;
      transition: opacity 0.15s;
      font-family: var(--mono);
      flex-shrink: 0;
    }

    .task-card:hover .drag-handle {
      opacity: 1;
    }

    .task-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--display);
      font-size: 14px;
      font-weight: 400;
      caret-color: var(--accent-b);
    }

    .task-input::placeholder {
      color: var(--muted);
    }

    .del-btn {
      width: 24px;
      height: 24px;
      background: transparent;
      border: none;
      border-radius: 5px;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.15s, background 0.15s, color 0.15s;
      flex-shrink: 0;
    }

    .task-card:hover .del-btn {
      opacity: 1;
    }

    .del-btn:hover {
      background: rgba(248, 113, 113, 0.1);
      color: var(--accent-r);
    }

    .progress-card {
      padding: 16px 18px;
      margin-bottom: 28px;
      background: var(--bg2);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .progress-val {
      color: var(--text);
    }

    input[type=range] {
      width: 100%;
      -webkit-appearance: none;
      height: 3px;
      background: var(--bg3);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--thumb-c, var(--accent-b));
      cursor: pointer;
      box-shadow: 0 0 8px var(--thumb-g, rgba(56, 189, 248, 0.5));
    }

    .note-card {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      margin-bottom: 7px;
      background: rgba(251, 146, 60, 0.04);
      border: 0.5px solid rgba(251, 146, 60, 0.14);
      border-radius: var(--radius);
      transition: border-color 0.15s;
    }

    .note-card:hover {
      border-color: rgba(251, 146, 60, 0.28);
    }

    .note-card:focus-within {
      border-color: rgba(251, 146, 60, 0.4);
    }

    .note-sym {
      font-family: var(--mono);
      font-size: 12px;
      color: rgba(251, 146, 60, 0.35);
      flex-shrink: 0;
      padding-top: 1px;
    }

    .note-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--display);
      font-size: 14px;
      resize: none;
      line-height: 1.5;
      caret-color: var(--accent-o);
      min-height: 21px;
    }

    .note-del {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.15s, color 0.15s;
      flex-shrink: 0;
    }

    .note-card:hover .note-del {
      opacity: 1;
    }

    .note-del:hover {
      color: var(--accent-r);
    }

    .empty {
      text-align: center;
      padding: 28px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.1em;
      border: 0.5px dashed var(--border);
      border-radius: var(--radius);
      margin-bottom: 28px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 9px 16px;
      background: var(--bg3);
      border: 0.5px solid var(--border2);
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text);
      letter-spacing: 0.07em;
      transform: translateY(50px);
      opacity: 0;
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
      z-index: 999;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast.success {
      border-color: rgba(52, 211, 153, 0.35);
      color: var(--accent-g);
    }

    .toast.error {
      border-color: rgba(248, 113, 113, 0.35);
      color: var(--accent-r);
    }
  </style>
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-row">
          <div class="brand-dot"></div>
          <div class="brand-name">goal.wallpaper</div>
        </div>
        <div class="brand-sub">focus system v2</div>
      </div>
      <nav class="nav">
        <div class="nav-item active" data-panel="weekly" style="--nc:var(--accent-v)">
          <div class="nav-dot" style="background:var(--accent-v)"></div>Weekly<span class="nav-count"
            id="cnt-weekly">0</span>
        </div>
        <div class="nav-item" data-panel="daily" style="--nc:var(--accent-g)">
          <div class="nav-dot" style="background:var(--accent-g)"></div>Daily<span class="nav-count"
            id="cnt-daily">0</span>
        </div>
        <div class="nav-item" data-panel="notes" style="--nc:var(--accent-o)">
          <div class="nav-dot" style="background:var(--accent-o)"></div>Notes<span class="nav-count"
            id="cnt-notes">0</span>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="unsaved-badge" id="unsavedBadge">
          <div class="unsaved-dot"></div>Unsaved changes
        </div>
        <button class="apply-btn" id="applyBtn">⬡ &nbsp;Apply Wallpaper</button>
        <div class="shortcut-hint"><span class="kbd">Ctrl</span> + <span class="kbd">S</span> to save &amp; apply</div>
        <div class="status-line" id="statusLine">ready</div>
      </div>
    </aside>

    <div class="main">
      <div class="topbar">
        <div class="topbar-title" id="panelTitle">Weekly Goals</div>
        <div class="topbar-right">
          <button class="icon-btn" id="reloadBtn" title="Discard changes &amp; reload">↺</button>
        </div>
      </div>
      <div class="content">
        <div class="panel active" id="panel-weekly">
          <div class="sec-hdr">
            <div class="sec-label">
              <div class="sec-dot" style="background:var(--accent-v);box-shadow:0 0 7px rgba(167,139,250,0.5)"></div>
              <span style="color:var(--accent-v)">weekly goals</span>
            </div>
            <button class="add-btn" data-list="weekly">+ Add</button>
          </div>
          <div class="task-list" id="list-weekly"></div>
          <div class="progress-card">
            <div class="progress-top"><span>Weekly progress</span><span class="progress-val" id="lbl-weekly">0%</span>
            </div>
            <input type="range" id="rng-weekly" min="0" max="100" value="0"
              style="--thumb-c:var(--accent-v);--thumb-g:rgba(167,139,250,0.5)" />
          </div>
        </div>
        <div class="panel" id="panel-daily">
          <div class="sec-hdr">
            <div class="sec-label">
              <div class="sec-dot" style="background:var(--accent-g);box-shadow:0 0 7px rgba(52,211,153,0.5)"></div>
              <span style="color:var(--accent-g)">daily tasks</span>
            </div>
            <button class="add-btn" data-list="daily">+ Add</button>
          </div>
          <div class="task-list" id="list-daily"></div>
          <div class="progress-card">
            <div class="progress-top"><span>Daily progress</span><span class="progress-val" id="lbl-daily">0%</span>
            </div>
            <input type="range" id="rng-daily" min="0" max="100" value="0"
              style="--thumb-c:var(--accent-g);--thumb-g:rgba(52,211,153,0.5)" />
          </div>
        </div>
        <div class="panel" id="panel-notes">
          <div class="sec-hdr">
            <div class="sec-label">
              <div class="sec-dot" style="background:var(--accent-o);box-shadow:0 0 7px rgba(251,146,60,0.5)"></div>
              <span style="color:var(--accent-o)">notes</span>
            </div>
            <button class="add-btn" data-list="notes">+ Add</button>
          </div>
          <div id="list-notes"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const { invoke } = window.__TAURI__.core; // Tauri Native Bridge

    // ── State ──────────────────────────────────────────────────────────────────────
    let data = { weekly: [], daily: [], notes: [], weekly_progress: 0, daily_progress: 0 };
    let dirty = false;
    let saving = false;

    // ── Load from Rust ─────────────────────────────────────────────────────────────
    async function loadData() {
      try {
        const raw = await invoke('load_data');
        data = JSON.parse(raw);
        renderAll();
        setDirty(false);
        setStatus('ready', '');
      } catch (e) {
        setStatus('Failed to load', 'error');
      }
    }

    // ── Render ─────────────────────────────────────────────────────────────────────
    function renderAll() {
      renderTasks('weekly'); renderTasks('daily'); renderNotes();
      setSlider('weekly', data.weekly_progress || 0); setSlider('daily', data.daily_progress || 0);
      updateCounts();
    }
    function renderTasks(key) {
      const el = document.getElementById('list-' + key); el.innerHTML = '';
      if (!data[key] || !data[key].length) { el.innerHTML = `<div class="empty">No ${key} items yet — click "+ Add"</div>`; return; }
      data[key].forEach((text, i) => {
        const d = document.createElement('div'); d.className = 'task-card';
        d.innerHTML = `<span class="drag-handle">⠿</span><input class="task-input" value="${esc(text)}" placeholder="Enter task..." data-key="${key}" data-idx="${i}"/><button class="del-btn" data-key="${key}" data-idx="${i}" title="Delete">✕</button>`;
        el.appendChild(d);
      });
    }
    function renderNotes() {
      const el = document.getElementById('list-notes'); el.innerHTML = '';
      if (!data.notes || !data.notes.length) { el.innerHTML = `<div class="empty">No notes yet — click "+ Add"</div>`; return; }
      data.notes.forEach((text, i) => {
        const d = document.createElement('div'); d.className = 'note-card';
        d.innerHTML = `<span class="note-sym">※</span><textarea class="note-input" rows="1" data-key="notes" data-idx="${i}" placeholder="Write a note...">${esc(text)}</textarea><button class="note-del" data-key="notes" data-idx="${i}" title="Delete">✕</button>`;
        el.appendChild(d); autoH(d.querySelector('textarea'));
      });
    }
    function setSlider(key, val) { document.getElementById('rng-' + key).value = val; document.getElementById('lbl-' + key).textContent = val + '%'; }
    function updateCounts() { ['weekly', 'daily', 'notes'].forEach(k => { document.getElementById('cnt-' + k).textContent = (data[k] || []).length; }); }
    function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
    function autoH(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
    function setDirty(val) { dirty = val; document.getElementById('unsavedBadge').classList.toggle('show', val); }

    // ── Input events (delegated) ────────────────────────────────────────────────────
    document.addEventListener('input', e => {
      const el = e.target;
      if (el.matches('.task-input') && el.dataset.key) { data[el.dataset.key][+el.dataset.idx] = el.value; setDirty(true); return; }
      if (el.matches('.note-input') && el.dataset.key) { data.notes[+el.dataset.idx] = el.value; autoH(el); setDirty(true); return; }
      if (el.id === 'rng-weekly') { data.weekly_progress = +el.value; document.getElementById('lbl-weekly').textContent = el.value + '%'; setDirty(true); }
      if (el.id === 'rng-daily') { data.daily_progress = +el.value; document.getElementById('lbl-daily').textContent = el.value + '%'; setDirty(true); }
    });
    document.addEventListener('click', e => {
      const btn = e.target.closest('.del-btn, .note-del'); if (!btn) return;
      const { key, idx } = btn.dataset; data[key].splice(+idx, 1);
      if (key === 'notes') renderNotes(); else renderTasks(key);
      updateCounts(); setDirty(true);
    });
    document.querySelectorAll('.add-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.list; if (!data[key]) data[key] = []; data[key].push('');
        if (key === 'notes') renderNotes(); else renderTasks(key);
        updateCounts(); setDirty(true);
      });
    });
    const TITLES = { weekly: 'Weekly Goals', daily: 'Daily Tasks', notes: 'Notes' };
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        item.classList.add('active'); document.getElementById('panel-' + item.dataset.panel).classList.add('active');
        document.getElementById('panelTitle').textContent = TITLES[item.dataset.panel];
      });
    });

    // ── Save & Apply via Rust Native API ──────────────────────────────────────────
    async function saveAndApply() {
      if (saving) return;
      saving = true; document.getElementById('applyBtn').classList.add('saving');
      setStatus('Saving data...', 'loading');

      try {
        await invoke('save_data', { data: JSON.stringify(data, null, 2) });
        setDirty(false); setStatus('Rendering wallpaper...', 'loading');

        const base64Img = await renderWallpaper();

        setStatus('Applying to desktop...', 'loading');
        await invoke('apply_wallpaper', { base64Img });

        setStatus('Wallpaper updated!', 'success');
        showToast('✓ Wallpaper applied', 'success');
      } catch (e) {
        console.error(e);
        setStatus('Error updating wallpaper', 'error');
        showToast('✗ Error: ' + e, 'error');
      } finally {
        saving = false; document.getElementById('applyBtn').classList.remove('saving');
      }
    }

    document.getElementById('applyBtn').addEventListener('click', saveAndApply);
    document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveAndApply(); } });
    document.getElementById('reloadBtn').addEventListener('click', () => { if (dirty && !confirm('Discard unsaved changes?')) return; loadData(); });

    // ── HTML to Image (Replaces Puppeteer) ────────────────────────────────────────
    async function renderWallpaper() {
      return new Promise(async (resolve, reject) => {
        const tplRes = await fetch('template.html');
        let html = await tplRes.text();
        const dateStr = new Date().toLocaleDateString("en-US", { weekday: "short", year: "numeric", month: "short", day: "numeric" }).toUpperCase();
        const buildTasks = (items, arrowClass) => items.map(i => `<div class="task-item"><span class="task-arrow ${arrowClass}">→</span><span class="task-text">${esc(i)}</span></div>`).join("");
        const buildNotes = (items) => items.map(i => `<div class="note-item"><span class="note-prefix">※</span><span class="note-text">${esc(i)}</span></div>`).join("");

        html = html.replace("{{DATE}}", dateStr)
          .replace("{{WEEKLY_COUNT}}", data.weekly.length)
          .replace("{{DAILY_COUNT}}", data.daily.length)
          .replace("{{NOTES_COUNT}}", data.notes.length)
          .replace(/{{WEEKLY_PROGRESS}}/g, data.weekly_progress || 0)
          .replace(/{{DAILY_PROGRESS}}/g, data.daily_progress || 0)
          .replace("{{WEEKLY_ITEMS}}", buildTasks(data.weekly, "arrow-weekly"))
          .replace("{{DAILY_ITEMS}}", buildTasks(data.daily, "arrow-daily"))
          .replace("{{NOTES_ITEMS}}", buildNotes(data.notes));

        const iframe = document.createElement('iframe');
        iframe.style.cssText = "position:absolute; width:1920px; height:1080px; top:-9999px; left:-9999px; border:none;";
        document.body.appendChild(iframe);

        iframe.contentWindow.document.open(); iframe.contentWindow.document.write(html); iframe.contentWindow.document.close();

        setTimeout(async () => {
          try {
            const dataUrl = await htmlToImage.toPng(iframe.contentWindow.document.body, { width: 1920, height: 1080, pixelRatio: 1 });
            document.body.removeChild(iframe);
            resolve(dataUrl);
          } catch (err) { reject(err); }
        }, 800);
      });
    }
    function setStatus(msg, type) { const el = document.getElementById('statusLine'); el.textContent = msg; el.className = 'status-line ' + type; }
    let toastTimer; function showToast(msg, type = '') { const t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast show ' + type; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = 'toast ' + type, 3000); }
    loadData();
  </script>
</body>
